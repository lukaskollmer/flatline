name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    # The newest image with a stable Xcode; macos-latest still ships Xcode 26 (Swift 6.3).
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select the latest stable Xcode
        run: |
          # Resolve version symlinks (Xcode_27.2.app may point at a release
          # candidate) before skipping betas and release candidates.
          xcode=$(
            for app in /Applications/Xcode_*.app; do
              app=$(realpath "$app")
              [[ $app == *[Bb]eta* || $app == *Release_Candidate* ]] && continue
              echo "$(defaults read "$app/Contents/Info" CFBundleShortVersionString) $app"
            done | sort -V | tail -n 1 | cut -d ' ' -f 2-
          )
          sudo xcode-select --switch "$xcode"
          xcrun swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: |
          # The tests have hung on macOS CI. If they take longer than 3
          # minutes, print the process tree and stack samples, then stop them.
          swift test --skip-build &
          tests=$!
          (
            for _ in $(seq 36); do
              sleep 5
              kill -0 "$tests" 2>/dev/null || exit 0
            done
            echo "::error::Tests still running after 3 minutes"
            echo "::group::Processes"
            ps -axo pid,ppid,etime,stat,command
            echo "::endgroup::"
            for pid in $(pgrep -f 'swiftpm-testing-helper|xctest|swift-build|swift-package|xcodebuild'); do
              echo "::group::sample $(ps -o pid=,command= -p "$pid" | cut -c 1-160)"
              sudo sample "$pid" 3 -file "$RUNNER_TEMP/sample-$pid.txt" >/dev/null 2>&1 \
                && cat "$RUNNER_TEMP/sample-$pid.txt" || echo "(could not sample)"
              echo "::endgroup::"
            done
            pkill -f 'swiftpm-testing-helper|xctest' || true
            kill "$tests" 2>/dev/null || true
          ) &
          watchdog=$!
          status=0
          wait "$tests" || status=$?
          wait "$watchdog" || true
          exit "$status"
      - name: Find unused code in flatline
        run: swift run flatline scan --strict --format github-actions

  linux:
    runs-on: ubuntu-latest
    container: swift:latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Find unused code in flatline
        run: swift run flatline scan --strict --format github-actions
