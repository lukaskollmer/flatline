name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Find unused code in flatline
        run: swift run flatline scan --strict --format github-actions

  linux:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Find unused code in flatline
        run: swift run flatline scan --strict --format github-actions
